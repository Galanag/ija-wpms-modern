services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ija
      POSTGRES_PASSWORD: ija_dev_password
      POSTGRES_DB: ija_wpms
    ports: ["5434:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ija -d ija_wpms"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ija:ija_dev_password@postgres:5432/ija_wpms?schema=public
      PORT: 4000
      WEB_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:?Session secret must be set}
      STORAGE_ROOT: /app/storage/uploads
      CORS_ORIGINS: http://localhost:3000
    ports: ["4000:4000"]
    depends_on: {postgres: {condition: service_healthy}}
    volumes: [uploads:/app/storage/uploads]
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: {NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1}
    environment: {NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  uploads:
